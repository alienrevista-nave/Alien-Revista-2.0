<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIEN // Revista</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060a;--v:#2bff9a;--m:#ff2bd6;--vd:#1a7a52;--md:#7a1a68;--txt:#c8ffe4;--dim:#5f9b80}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:'Share Tech Mono','Courier New',monospace;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:1px solid var(--v);padding:.55rem 1.1rem;cursor:pointer}
button:hover,button:focus-visible{background:var(--v);color:#000;outline:none}
h2{font-family:'VT323',monospace;font-size:1.35rem;font-weight:400;margin:0 0 .5rem;color:var(--v);letter-spacing:.05em}
/* ARRANQUE */
#boot{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;background:var(--bg);transition:opacity .8s,transform .8s}
#boot.off{opacity:0;transform:scale(1.35);pointer-events:none}
#boot img{width:min(70vw,520px);animation:glitch 3.5s infinite}
#log{min-height:7.5em;width:min(90vw,440px);color:var(--dim);font-size:.9rem;line-height:1.5;white-space:pre}
#entrar{opacity:0;pointer-events:none;font-size:1.15rem;border-color:var(--m);color:var(--m)}
#entrar.on{opacity:1;pointer-events:auto;animation:pulso 1.4s infinite}
#entrar:hover{background:var(--m);color:#000}
@keyframes glitch{0%,92%,100%{transform:none}94%{transform:translateX(7px) skewX(6deg)}96%{transform:translateX(-7px)}}
@keyframes pulso{50%{box-shadow:0 0 18px var(--m)}}
/* INTERFAZ */
#hud{position:fixed;inset:0;display:grid;grid-template-columns:250px 1fr 300px;grid-template-rows:54px 1fr 96px;gap:10px;padding:10px;opacity:0;transition:opacity 1s}
#hud.on{opacity:1}
.box{position:relative;border:1px solid #14533a;background:rgba(6,12,12,.88);padding:.7rem;min-height:0;overflow:hidden}
.sc{overflow-y:auto;overflow-x:hidden}
*{scrollbar-width:thin;scrollbar-color:#14533a transparent}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#14533a}::-webkit-scrollbar-track{background:transparent}
.box::before,.box::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--m);pointer-events:none}
.box::before{top:0;left:0;border-right:0;border-bottom:0}
.box::after{bottom:0;right:0;border-left:0;border-top:0}
#top{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.4rem .9rem;font-size:.85rem;color:var(--dim)}
.brand{display:flex;align-items:center;gap:.7rem;color:var(--v);font-size:1rem}.brand img{height:34px}.brand .lg{height:24px}
#izq{display:grid;grid-template-rows:1fr;min-height:0}
#der{display:grid;grid-template-rows:auto 1fr;gap:10px;min-height:0}
.item{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;border:0;border-bottom:1px solid #0f2b20;padding:.35rem .2rem;font-size:.85rem}
.item:hover,.item.act{background:rgba(255,43,214,.14);color:#fff}
.item i{font-style:normal;color:var(--m);width:1.4em}
.ic{flex:none;width:30px;height:30px;border:1px dashed var(--vd);display:grid;place-items:center}
.ic img{width:100%;height:100%;object-fit:contain}
.item small{display:block;color:var(--dim);font-size:.7rem}
#redes a{display:block;color:var(--txt);text-decoration:none;padding:.4rem 0;border-bottom:1px solid #0f2b20;font-size:.85rem}
#redes a:hover{color:var(--m)}
#freq{display:flex;flex-direction:column}#freq iframe{flex:none;height:352px;width:100%;border:0}#spbtn{width:100%;border-color:var(--m);color:var(--m)}#spbtn:hover{background:var(--m);color:#000}
.sp{display:block;margin-top:.6rem;font-size:.75rem;color:var(--dim);text-decoration:none}.sp:hover{color:var(--m)}
/* ESCENA */
#stage{position:relative;padding:0;overflow:hidden}
#cv{width:100%;height:100%;display:block}
#tip{position:absolute;pointer-events:none;padding:.3rem .6rem;border:1px solid var(--m);background:#000d;font-size:.8rem;display:none;white-space:nowrap}
#skip{position:absolute;right:12px;bottom:8px;padding:.25rem .7rem;font-size:.75rem;border-color:var(--m);color:var(--m);display:none}#skip:hover{background:var(--m);color:#000}
.volando #hint{display:none}
#hint{position:absolute;left:12px;bottom:8px;font-size:.72rem;color:var(--dim)}
/* LECTOR */
#reader{position:absolute;inset:0;background:#05060af5;display:none;grid-template-columns:240px 1fr;border-top:3px solid var(--m)}
#reader.on{display:grid}
#rlist{border-right:1px solid #14533a;overflow:auto;padding:1rem}
#rlist h3{font-family:'VT323',monospace;font-size:1.8rem;font-weight:400;margin:0 0 .2rem;color:var(--m)}
#rlist p{margin:0 0 1rem;font-size:.78rem;color:var(--dim)}
#rbody{overflow:auto;padding:1.5rem clamp(1rem,4vw,3rem)}
#rbody h4{font-family:'VT323',monospace;font-size:2.4rem;font-weight:400;margin:0 0 1rem;color:var(--v)}
#rbody div{max-width:62ch;line-height:1.7;white-space:pre-wrap}
#cerrar{position:absolute;top:8px;right:8px;border-color:var(--m);color:var(--m);padding:.3rem .8rem}
#cerrar:hover{background:var(--m);color:#000}
/* BARRA INFERIOR */
#bot{grid-column:1/4;display:grid;grid-template-columns:250px 1fr;gap:10px;min-height:0}
#radar{display:flex;align-items:center;gap:.8rem;padding:.3rem .7rem;text-align:left;border-color:#14533a;font-size:.8rem;width:100%}
#radar svg{height:100%;max-height:78px;flex:none}
#radar small{display:block;color:var(--dim);font-size:.68rem}
#radar:hover,#radar.act{background:rgba(255,43,214,.14);color:#fff}
#nave{display:flex;align-items:center;gap:1rem;font-size:.75rem;line-height:1.5;color:var(--dim)}
#nave img{height:62px}#nave b{color:var(--v);font-weight:400}
#nave em{font-style:normal;color:var(--m)}
#crt{position:fixed;inset:0;pointer-events:none;z-index:20;background:repeating-linear-gradient(0deg,#0000 0 2px,#0000001f 2px 3px)}
@media (max-width:860px){
 #hud{grid-template-columns:1fr;grid-template-rows:48px 1fr 150px 70px;overflow:auto}
 #der,#nave,#freq,#top .x{display:none}
 #izq{grid-row:3;grid-template-rows:1fr}
 #bot{grid-template-columns:1fr}
 #top,#bot{grid-column:1}
 #reader{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 #rlist{border-right:0;border-bottom:1px solid #14533a;max-height:38%}
}
body.calma *{animation:none!important;transition:none!important}
</style>
</head>

SECCIONES.filter(s=>!s.oculta).forEach((s,i)=>{const b=document.createElement('button');b.className='item';b.dataset.id=s.id;
 b.innerHTML=`${icon(s.id)}<i>${String(i+1).padStart(2,'0')}</i><span>${s.nombre}<small>${s.sub}</small></span>`;b.onclick=()=>abrir(s.id);$('menu').appendChild(b)});
$('redes').innerHTML=REDES.map(r=>r.mov?`<a href="#" data-mov>${r.t}</a>`:r.sec?`<a href="#" data-sec="${r.sec}">${r.t}</a>`:`<a href="${r.url}"${r.url.startsWith('http')?' target="_blank" rel="noopener"':''}>${r.t}</a>`).join('');
$('redes').addEventListener('click',e=>{const m=e.target.closest('a[data-mov]');if(m){e.preventDefault();calma=!calma;document.body.classList.toggle('calma',calma);m.textContent='Movimiento: '+(calma?'reducido':'activado');if(calma&&volando)fin();return}const a=e.target.closest('a[data-sec]');if(a){e.preventDefault();abrir(a.dataset.sec)}});
$('radar').onclick=()=>abrir('cronicas');
$('spbtn').onclick=()=>{const f=document.createElement('iframe');f.src='https://open.spotify.com/embed/playlist/57qxI5VqHjOi9sVwA03cWM?utm_source=generator&theme=0';f.allow='autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';f.title='Playlist Frecuencias';$('spbtn').replaceWith(f)};
function marcar(id){document.querySelectorAll('#menu .item').forEach(e=>e.classList.toggle('act',e.dataset.id==id));$('radar').classList.toggle('act',id==='cronicas')}
function abrir(id){const s=SECCIONES.find(x=>x.id==id);
 $('rlist').innerHTML=`<h3>${s.nombre}</h3><p>${s.sub}</p>`;
 s.notas.forEach((n,i)=>{const b=document.createElement('button');b.className='item';b.textContent=n.titulo;b.onclick=()=>nota(s,i);$('rlist').appendChild(b)});
 nota(s,0);$('reader').classList.add('on');marcar(id)}
function nota(s,i){const n=s.notas[i],h=document.createElement('h4'),d=document.createElement('div');h.textContent=n.titulo;d.textContent=n.texto;$('rbody').replaceChildren(h,d);$('rbody').scrollTop=0}
function cerrar(){$('reader').classList.remove('on');marcar(null)}
$('cerrar').onclick=cerrar;addEventListener('keydown',e=>{if(e.key==='Escape')cerrar()});

/* ============ RADAR ============ */
let calma=false;const NS='http://www.w3.org/2000/svg';
const blips=[...Array(6)].map(()=>{const c=document.createElementNS(NS,'circle');c.setAttribute('fill','#ff2bd6');c.setAttribute('r','2.6');$('blips').appendChild(c);
 const b={c,th:0,last:-1e9,ready:true,place(){this.th=Math.random()*360;const r=12+Math.random()*32,a=this.th*Math.PI/180;c.setAttribute('cx',50+r*Math.sin(a));c.setAttribute('cy',50-r*Math.cos(a))}};b.place();return b});
(function radar(t){requestAnimationFrame(radar);if(calma){blips.forEach(b=>b.c.setAttribute('opacity','.8'));return}
 const ang=(t*.072)%360;
 ['sw','tr'].forEach(i=>$(i).setAttribute('transform',`rotate(${ang} 50 50)`));
 blips.forEach(b=>{const d=(ang-b.th+360)%360;
  if(d<8&&b.ready){b.last=t;b.ready=false}
  const op=Math.max(0,1-(t-b.last)/3200);b.c.setAttribute('opacity',op);
  if(op<=0&&d>200&&!b.ready){b.place();b.ready=true}})})(0);

/* ============ CIUDAD 3D: planeta + vuelo de entrada + parallax ============ */
const V=0x2bff9a,M=0xff2bd6,cv=$('cv'),stage=$('stage'),tip=$('tip');
const PAR={a:.3,y:3};   // intensidad del parallax (giro en radianes, altura)
const FLY=7000;         // duración del vuelo de entrada (ms)
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05060a);
const cam=new THREE.PerspectiveCamera(45,1,.5,2000);
scene.add(new THREE.AmbientLight(0x7a5aff,.9));
const dl=new THREE.DirectionalLight(0xff9ae8,1.1);dl.position.set(6,10,4);scene.add(dl);
const ground=new THREE.Mesh(new THREE.BoxGeometry(11,.2,11),new THREE.MeshStandardMaterial({color:0x0c1412}));ground.position.y=-.1;scene.add(ground);
const grid=new THREE.GridHelper(11,22,V,0x0f3a2a);grid.position.y=.01;scene.add(grid);

// planeta de grilla: la ciudad queda en su polo norte
const PR=60,planet=new THREE.Group();planet.position.y=-PR-.25;scene.add(planet);
planet.add(new THREE.Mesh(new THREE.SphereGeometry(PR-.05,64,48),new THREE.MeshBasicMaterial({color:0x05060a})));
planet.add(new THREE.Mesh(new THREE.SphereGeometry(PR+1.6,48,32),new THREE.MeshBasicMaterial({color:M,transparent:true,opacity:.1,side:THREE.BackSide})));
(function(){const p=[],n=64,pt=(la,lo)=>[Math.cos(la)*PR*Math.cos(lo),Math.sin(la)*PR,Math.cos(la)*PR*Math.sin(lo)];
 for(let i=1;i<18;i++){const la=Math.PI*i/18-Math.PI/2;for(let j=0;j<n;j++)p.push(...pt(la,2*Math.PI*j/n),...pt(la,2*Math.PI*(j+1)/n))}
 for(let k=0;k<36;k++){const lo=2*Math.PI*k/36;for(let j=0;j<n;j++)p.push(...pt(Math.PI*j/n-Math.PI/2,lo),...pt(Math.PI*(j+1)/n-Math.PI/2,lo))}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
 planet.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:V,transparent:true,opacity:.55})))})();

const clickables=[];
function registrar(o,s){o.userData.sec=s.id;clickables.push(o)}
SECCIONES.filter(s=>s.forma).forEach(s=>{const f=s.forma;
 const m=new THREE.Mesh(new THREE.BoxGeometry(f.w,f.h,f.d),new THREE.MeshStandardMaterial({color:0x0f3d2a,emissive:V,emissiveIntensity:.25}));
 m.position.set(f.x,f.h/2,f.z);m.userData.placeholder=true;scene.add(m);registrar(m,s)});

new THREE.GLTFLoader().load('ciudad.glb',gltf=>{
 clickables.filter(o=>o.userData.placeholder).forEach(o=>scene.remove(o));clickables.length=0;
 const box=new THREE.Box3().setFromObject(gltf.scene),size=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),k=10/Math.max(size.x,size.z);
 gltf.scene.scale.setScalar(k);gltf.scene.position.set(-c.x*k,-box.min.y*k,-c.z*k);scene.add(gltf.scene);scene.remove(ground,grid);
 gltf.scene.traverse(n=>{const nm=(n.name||'').toLowerCase();if(!nm||n.userData.sec)return;
  const s=SECCIONES.find(s=>s.match.some(w=>nm.includes(w)));
  if(s){let p=n.parent,ya=false;while(p){if(p.userData.sec)ya=true;p=p.parent}
   if(!ya){registrar(n,s);n.traverse(m=>{if(m.isMesh){m.material=m.material.clone();if(m.material.emissive)m.userData.e0=[m.material.emissive.clone(),m.material.emissiveIntensity]}})}}});
 const faltan=SECCIONES.filter(s=>s.match.length&&!clickables.some(o=>o.userData.sec==s.id));
 if(faltan.length)console.warn('Sin objeto en el .glb para:',faltan.map(s=>s.id));
},undefined,()=>{});

// cámara: vuelo desde el espacio hasta la vista de la ciudad, y después parallax
const P0=new THREE.Vector3(0,30,240),P1=new THREE.Vector3(18.7,17.5,18.7),T0=new THREE.Vector3(0,-PR,0),T1=new THREE.Vector3(0,1,0),tg=new THREE.Vector3();
let mx=0,my=0,sx=0,sy=0,hover=null,t0=null,tEnd=0,volando=true;
function startIntro(){if(calma)return fin();t0=performance.now();stage.classList.add('volando');$('skip').style.display='block'}
function fin(){volando=false;tEnd=performance.now();cam.fov=25;cam.updateProjectionMatrix();stage.classList.remove('volando');$('skip').style.display='none'}
$('skip').onclick=fin;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);renderer.setPixelRatio(Math.min(devicePixelRatio,2));cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function pick(e){const r=cv.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
 ray.setFromCamera(mouse,cam);
 for(const h of ray.intersectObjects(clickables,true)){let p=h.object;while(p){if(p.userData.sec)return p;p=p.parent}}return null}
function brillo(o,on){if(!o)return;o.traverse(m=>{if(!m.isMesh||!m.material.emissive)return;
 if(on){m.material.emissive.set(M);m.material.emissiveIntensity=.9}
 else if(m.userData.e0){m.material.emissive.copy(m.userData.e0[0]);m.material.emissiveIntensity=m.userData.e0[1]}
 else{m.material.emissive.set(V);m.material.emissiveIntensity=.25}})}
cv.addEventListener('pointermove',e=>{if(volando)return;const o=pick(e);if(o!==hover){brillo(hover,false);hover=o;brillo(o,true)}
 cv.style.cursor=o?'pointer':'default';
 if(o){const s=SECCIONES.find(s=>s.id==o.userData.sec),r=stage.getBoundingClientRect();tip.style.display='block';tip.textContent=s.nombre+' · '+s.sub;
  tip.style.left=Math.min(e.clientX-r.left+14,r.width-tip.offsetWidth-6)+'px';tip.style.top=(e.clientY-r.top+14)+'px'}else tip.style.display='none'});
cv.addEventListener('pointerleave',()=>{tip.style.display='none'});
cv.addEventListener('click',e=>{if(volando)return;const o=pick(e);if(o)abrir(o.userData.sec)});

(function loop(t){requestAnimationFrame(loop);
 if(volando){const u=t0===null?0:Math.min(1,(t-t0)/FLY),e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
  cam.position.lerpVectors(P0,P1,e);tg.lerpVectors(T0,T1,e);cam.fov=45-20*e;cam.updateProjectionMatrix();cam.lookAt(tg);
  if(u>=1)fin()}
 else{sx+=(mx-sx)*.05;sy+=(my-sy)*.05;const k=calma?0:1,a=Math.PI/4+(sx*PAR.a+Math.sin((t-tEnd)/4000)*.03)*k;
  cam.position.set(Math.cos(a)*26.45,17.5+sy*PAR.y*k,Math.sin(a)*26.45);cam.lookAt(T1)}
 planet.rotation.y+=.0004;renderer.render(scene,cam)})(0);
resize();
</script>
</body>
